[package]
name = "kaf-cli"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
authors = ["kaf-rs team"]
description = "Convert TXT and Markdown documents to EPUB 3 ebooks"
license = "GPL-3.0-or-later"
repository = "https://github.com/feewg/epub"
readme = "README.md"

[lib]
name = "kaf_cli"
path = "src/lib.rs"

[[bin]]
name = "kaf-cli"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# 异步运行时（仅启用实际使用的能力）
tokio = { version = "1.37", features = ["fs", "macros", "rt-multi-thread"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# 正则表达式
regex = "1.10"
once_cell = "1.19"

# 编码检测
chardetng = "1.0"
encoding_rs = "0.8"

# 图片处理
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }

# Markdown
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# 错误处理
thiserror = "1.0"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# EPUB 生成
epub-builder = { version = "0.8", default-features = false, features = ["zip-library"] }

# 日期时间
chrono = "0.4"

# JSON 序列化（用于报告生成）
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bench]]
name = "parser_benchmark"
harness = false
